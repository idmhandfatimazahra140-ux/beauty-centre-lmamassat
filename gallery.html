<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المعرض - Smito Beauty Centre</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .gallery {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }
        .gallery h1 {
            text-align: center;
            margin-bottom: 3rem;
            color: var(--dark-black);
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }
        .gallery-item {
            background: var(--light-gray);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .gallery-item:hover {
            transform: scale(1.05);
        }
        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .gallery-item-text {
            padding: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">Smito Beauty</div>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="gallery.html" class="active">المعرض</a></li>
                <li><a href="blog.html">المدونة</a></li>
                <li><a href="index.html#contact">اتصل بنا</a></li>
            </ul>
        </div>
    </nav>

    <div class="gallery">
        <h1>معرض أعمالنا</h1>
        <div class="gallery-grid">
            <div class="gallery-item">
                <div style="background: linear-gradient(45deg, #E94B9D, #1A1A1A); height: 250px; display: flex; align-items: center; justify-content: center;">
                    <p style="color: white; font-size: 3rem;">💇‍♀️</p>
                </div>
                <div class="gallery-item-text">
                    <h3>قص وتصفيف</h3>
                    <p>تصفيفات حديثة واحترافية</p>
                </div>
            </div>
            <div class="gallery-item">
                <div style="background: linear-gradient(45deg, #1A1A1A, #E94B9D); height: 250px; display: flex; align-items: center; justify-content: center;">
                    <p style="color: white; font-size: 3rem;">🎨</p>
                </div>
                <div class="gallery-item-text">
                    <h3>صبغ احترافي</h3>
                    <p>ألوان متنوعة وآمنة</p>
                </div>
            </div>
            <div class="gallery-item">
                <div style="background: linear-gradient(45deg, #E94B9D, #1A1A1A); height: 250px; display: flex; align-items: center; justify-content: center;">
                    <p style="color: white; font-size: 3rem;">💄</p>
                </div>
                <div class="gallery-item-text">
                    <h3>مكياج احترافي</h3>
                    <p>مكياج للمناسبات الخاصة</p>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 Smito Beauty Centre. جميع الحقوق محفوظة</p>
    </footer>
</body>
</html>
